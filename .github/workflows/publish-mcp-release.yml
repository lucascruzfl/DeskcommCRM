name: Publicar release MCP validada

on:
  push:
    branches: [mcp/stable]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcp-release-stable
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'lucascruzfl/DeskcommCRM' && github.ref == 'refs/heads/mcp/stable'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verificar auditoria e release pronta
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .deskcomm_version docs/mcp/RELEASE-AUDIT.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-mcp"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json assets,isDraft --jq 'if .isDraft then empty else .assets[].name end' 2>/dev/null | grep -qx mcp-release.json; then
            echo 'needed=no' >> "$GITHUB_OUTPUT"
            echo "MCP release $tag já pronta; nada a publicar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'needed=yes' >> "$GITHUB_OUTPUT"
          fi
  validate:
    needs: check
    if: needs.check.outputs.needed == 'yes'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tools: ${{ steps.tools.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir tag, base oficial e auditoria
        id: version
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mcp$ ]]
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          version="${RELEASE_TAG#v}"
          version="${version%-mcp}"
          git fetch --no-tags https://github.com/melgarafael/DeskcommCRM.git \
            "refs/tags/v${version}:refs/tags/upstream-${version}"
          git merge-base --is-ancestor "upstream-${version}" HEAD
          upstream_sha="$(git rev-parse "upstream-${version}^{commit}")"
          jq -e --arg v "$version" --arg sha "$upstream_sha" \
            '.deskcomm_version == $v and .upstream_tag == ("v" + $v) and .upstream_commit == $sha and .gaps_a == 0 and .mcp_compatible == true' \
            docs/mcp/RELEASE-AUDIT.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm lint
      - run: pnpm lint:channels
      - run: pnpm lint:role-rank
      - run: pnpm test:unit
      - run: pnpm test:db:update
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.invalid
          NEXT_PUBLIC_ADMIN_URL: https://placeholder.invalid
      - name: MCP, política, fluxos e atualizador
        run: pnpm exec vitest run tests/unit/manifest-x-migrations.test.ts tests/unit/mcp-compatibility-sentinels.test.ts tests/unit/mcp-final-flows.test.ts tests/unit/mcp-campaign-isolation.test.ts tests/unit/mcp-rate-limit.test.ts app/api/v1/system/version/route.test.ts app/api/v1/system/update/route.test.ts
      - name: Baseline e invariantes em banco descartável
        run: pnpm test:db
      - run: pnpm test:shell
      - run: python3 -m unittest tests/unit/mcp_upstream_test.py tests/unit/mcp_manifest_test.py
      - name: Snapshot do catálogo, sem número fixo
        id: tools
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
        run: |
          count="$(pnpm exec tsx -e 'import { MCP_TOOL_COUNT } from "./lib/mcp/registry"; process.stdout.write(String(MCP_TOOL_COUNT))')"
          [[ "$count" =~ ^[0-9]+$ ]] && test "$count" -gt 0
          echo "count=$count" >> "$GITHUB_OUTPUT"

  publish:
    needs: [check, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar as quatro imagens do mesmo commit
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for spec in 'app:deskcommcrm:Dockerfile' 'worker:deskcomm-worker:Dockerfile.worker' 'scheduler:deskcomm-scheduler:Dockerfile.scheduler' 'voice_agent:deskcomm-voice-agent:Dockerfile.voice-agent'; do
            IFS=: read -r role name dockerfile <<< "$spec"
            repository="ghcr.io/$owner/$name"
            docker buildx build --platform linux/amd64 --file "$dockerfile" \
              --build-arg "APP_VERSION=${RELEASE_VERSION}-mcp" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=${RELEASE_VERSION}-mcp" \
              --tag "${repository}:${RELEASE_VERSION}-mcp" \
              --metadata-file "${role}.metadata.json" --push .
          done
      - name: Criar manifesto após o push completo
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          TOOL_COUNT: ${{ needs.validate.outputs.tools }}
        run: |
          python3 scripts/mcp_manifest.py
          python3 hostgator-setup-kit/mcp-release-validate.py mcp-release.json \
            "v${RELEASE_VERSION}-mcp" "$GITHUB_SHA" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deskcommcrm"
      - name: Conferir acesso anônimo aos quatro digests
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config"' EXIT
          export DOCKER_CONFIG="$anonymous_config"
          python3 - <<'PY' > mcp-image-refs.txt
          import json
          with open("mcp-release.json", encoding="utf-8") as stream:
              images = json.load(stream)["images"]
          for role in ("app", "worker", "scheduler", "voice_agent"):
              image = images[role]
              print(image["repository"] + "@" + image["digest"])
          PY
          while IFS= read -r ref; do
            timeout 30s docker buildx imagetools inspect "$ref" >/dev/null
          done < mcp-image-refs.txt
      - name: Publicar o manifesto como última etapa
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" mcp-release.json --clobber
          else
            gh release create "$RELEASE_TAG" mcp-release.json --draft \
              --verify-tag --title "$RELEASE_TAG" \
              --notes "DeskcommCRM + MCP Full Control; testes e digests no manifesto."
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx mcp-release.json
          gh release edit "$RELEASE_TAG" --draft=false
          echo "MCP release $RELEASE_TAG pronta para atualização. A VPS só atualiza após o clique humano no painel." >> "$GITHUB_STEP_SUMMARY"

  blocked-summary:
    needs: [check, validate, publish]
    if: always() && github.repository == 'lucascruzfl/DeskcommCRM' && github.ref == 'refs/heads/mcp/stable' && (needs.check.result != 'success' || (needs.check.outputs.needed == 'yes' && needs.publish.result != 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Explicar bloqueio
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          CHECK_RESULT: ${{ needs.check.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          echo "Nova versão upstream detectada, mas MCP não foi publicado." >> "$GITHUB_STEP_SUMMARY"
          echo "Alvo: $RELEASE_TAG. Conferência: $CHECK_RESULT. Validação: $VALIDATE_RESULT. Publicação: $PUBLISH_RESULT." >> "$GITHUB_STEP_SUMMARY"
          falhas="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job): \(.name)"' 2>/dev/null || true)"
          if [ -n "$falhas" ]; then
            echo 'Passos que falharam:' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r passo; do echo "- $passo" >> "$GITHUB_STEP_SUMMARY"; done <<< "$falhas"
          fi
          echo "Sem fallback para imagem oficial." >> "$GITHUB_STEP_SUMMARY"
